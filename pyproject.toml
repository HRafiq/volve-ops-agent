[project]
name = "volve-ops-agent"
version = "0.1.0"
description = "Evidence-bound operational investigation over the Volve open dataset"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Exact pins throughout. A result is only reproducible if the manifest can name the
# versions that produced it, and several packages this project will add later move fast.
#
# Only what the code imports today. openpyxl rather than pandas for the workbook: it yields
# None for an empty cell, where pandas yields NaN, and NaN in a field whose contract is that
# missing stays missing would be neither missing nor quarantined and would poison every later
# sum. The canonical model rejects non-finite floats as a second line of defence.
dependencies = [
    "pydantic==2.9.2",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# The MCP adapter is optional on purpose: the domain services and the tool layer work without
# it, and the deterministic CI job should not need a protocol server to run unit tests.
mcp = [
    "mcp==1.9.4",
]
# Also optional: a run manifest is written to a file either way, so a reader of this
# repository can see what a run recorded without standing up a tracking server.
tracking = [
    "mlflow==2.17.2",
]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Neither package ships type stubs. Scoped to them so the rest stays strict.
module = ["defusedxml.*", "openpyxl.*", "mcp.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
